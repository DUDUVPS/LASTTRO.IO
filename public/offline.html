<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>LASTTRO offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #ece9df;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(74,158,255,.18), transparent 30%),
        radial-gradient(circle at 78% 72%, rgba(168,85,247,.14), transparent 34%),
        #0d0d0b;
    }
    main {
      width: min(420px, 100%);
      display: grid;
      gap: 14px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: rgba(23,23,21,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }
    img { width: 180px; max-width: 80%; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #9a968d; line-height: 1.5; }
    a {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      background: #a855f7;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-nome.png" alt="LASTTRO">
    <h1>Sem conexao agora</h1>
    <p>O LASTTRO esta instalado, mas precisa de internet para sincronizar seus dados salvos no servidor.</p>
    <a href="/app">Tentar abrir novamente</a>
  </main>
</body>
</html>
